version: "3.9"

services:
  # Backend Node.js API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: industry40-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      # Node Environment
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000

      # Database (External - Prisma)
      DATABASE_URL: ${DATABASE_URL}

      # CORS & Client
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}

      # AI Inference API URL (internal service communication)
      INFERENCE_API_URL: ${INFERENCE_API_URL:-http://ai-inference:8000}

      # AWS S3 Configuration
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}

      # Email Configuration (Mailtrap/Nodemailer)
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}

      # AI/LLM API Keys
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}

      # Application Secrets
      JWT_SECRET: ${JWT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
    volumes:
      # Persist logs outside container
      - ./backend/logs:/app/logs
    networks:
      - industry40-network
    depends_on:
      - ai-inference
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # AI Inference API Service
  ai-inference:
    build:
      context: ./ai_inference_api
      dockerfile: Dockerfile
    container_name: industry40-ai-inference
    restart: unless-stopped
    ports:
      - "${AI_INFERENCE_PORT:-8001}:8000"
    environment:
      # Server Configuration
      HOST: 0.0.0.0
      PORT: 8000
      DEBUG: ${DEBUG:-false}

      # CORS
      ALLOWED_ORIGINS: ${AI_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5000}

      # Model Configuration
      MODEL_DIR: models
      BEAN_MODEL_PATH: models/bean_model.onnx
      MAIZE_MODEL_PATH: models/maize_model.onnx
      DEFAULT_MODEL: bean

      # Image Processing
      MAX_IMAGE_SIZE: 10485760 # 10MB in bytes
    volumes:
      # Mount models directory if you want to update models without rebuilding
      # - ./ai_inference_api/models:/app/models:ro
      # Persist logs
      - ./ai_inference_api/logs:/app/logs
    networks:
      - industry40-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

networks:
  industry40-network:
    driver: bridge
    name: industry40-network
